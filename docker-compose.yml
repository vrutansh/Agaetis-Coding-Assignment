services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roster
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: roster
    ports:
      - "5433:5432"
    volumes:
      - roster_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster -d roster"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roster_postgres:

